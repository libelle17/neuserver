# 13.10.2026: mysqld mit jemalloc statt der glibc-Speicherverwaltung (malloc/free) betreiben.
# Anlass: OOM-Kill von mysqld mit 40 GB RSS am 12.10.26 bei nur 8 GB innodb_buffer_pool; /var/log/mysqlspeicher.log
# zeigte danach: MariaDBs eigene Zaehlung (MEMORY_USED) konstant ~9,1 GB, RSS aber +2..9 GB je Praxistag bei bis zu
# ~290 gleichzeitigen Verbindungen -> Zerstueckelung in glibc-malloc, Speicher wird nie zurueckgegeben.
# Pruefen: SELECT @@version_malloc_library (statt "system" dann "jemalloc ...").
# thp:never: jemalloc nutzt fuer seine Bereiche keine Transparent Huge Pages (hier systemweit "always"), sonst kann
# freigegebener Speicher in Huge Pages haengen bleiben; der InnoDB-Pufferpool (mmap) ist davon nicht betroffen.
# Ruecknahme: Datei loeschen (auch in /root/neuserver und ziele), systemctl daemon-reload, systemctl restart mariadb.
[Service]
Environment=LD_PRELOAD=/usr/lib64/libjemalloc.so.2
Environment=MALLOC_CONF=thp:never
