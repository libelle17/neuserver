# 2.10.2026: MariaDB erst starten, wenn /DATA eingehaengt ist - secure_file_priv in /etc/my.cnf zeigt auf
# /DATA/mariatrans; fehlt das Verzeichnis beim Start ("Failed to normalize the argument for --secure-file-priv"),
# bricht mysqld ab. Auf linux7 startete MariaDB deshalb seit Mitte September bei keinem Boot.
[Unit]
RequiresMountsFor=/DATA/mariatrans
