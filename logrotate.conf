compress
missingok
compresscmd /usr/bin/xz
commressext -9
compressext .xz
rotate 1
 size 200k

/var/log/messages /var/log/warn {
 postrotate 
   /usr/bin/killall -HUP syslogd
 endscript
}

/var/log/httpd/access.log /var/log/httpd/error.log {
 postrotate 
   /usr/bin/killall -HUP httpd
 endscript
 }
 
/var/log/*.log /var/log/mail /var/log/*.info /var/log/*.error /var/log/*.err /var/log/*.warn /var/log/*.txt /var/log/firewall {
 postrotate
  # Der netconsole-Empfaenger (socat, linux1) haelt /var/log/netconsole-linux0.log offen und schriebe nach dem
  # Rotieren in die alte Datei weiter - dann neu starten. Das Skript laeuft je rotierter Datei ($1), also nur bei
  # dieser einen: am 31.10.2026 gab ein Neustart je Datei 6 Neustarts in 10 s, systemd gab den Dienst auf.
  [ "$1" = /var/log/netconsole-linux0.log ] && systemctl -q is-enabled netconsole-empfang.service 2>/dev/null && systemctl restart netconsole-empfang.service >/dev/null 2>&1 || true
 endscript
}
