compress
missingok
compresscmd /usr/bin/xz
commressext -9
compressext .xz
rotate 1
 size 200k

/var/log/messages /var/log/warn {
 postrotate 
   /usr/bin/killall -HUP syslogd
 endscript
}

/var/log/httpd/access.log /var/log/httpd/error.log {
 postrotate 
   /usr/bin/killall -HUP httpd
 endscript
 }
 
/var/log/*.log /var/log/mail /var/log/*.info /var/log/*.error /var/log/*.err /var/log/*.warn /var/log/*.txt /var/log/firewall {
 postrotate
  # 10.10.2026: der netconsole-Empfaenger (socat, linux1) haelt /var/log/netconsole-linux0.log offen und
  # schrieb nach dem Rotieren in die umbenannte/geloeschte Datei weiter (seit 5.10. nichts mehr mitgeschrieben,
  # auch nicht der Haenger vom 9.10.) - neu starten, damit er die neue Datei oeffnet. Auf Rechnern ohne
  # diesen Dienst tut try-restart nichts.
  systemctl try-restart netconsole-empfang.service >/dev/null 2>&1 || true
 endscript
}
