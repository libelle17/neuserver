# SSH-Zertifikate (Pilot). ERGAENZT die Anmeldung per authorized_keys, ersetzt sie nicht:
# normale Schluessel funktionieren weiter, zusaetzlich werden von der CA signierte
# Zertifikate akzeptiert, sofern eine ihrer "Principals" fuer das Zielkonto erlaubt ist.
TrustedUserCAKeys /etc/ssh/ca/user_ca.pub
AuthorizedPrincipalsFile /etc/ssh/ca/principals/%u
# Spaeter (Widerruf): RevokedKeys /etc/ssh/ca/revoked.krl
