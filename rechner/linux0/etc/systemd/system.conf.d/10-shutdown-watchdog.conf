# 20.9.2026: Haengt das Herunterfahren/Neustarten (Vorfaelle linux0 24./25.7. und 11.9.2026),
# setzt der Hardware-Watchdog (iTCO_wdt, /dev/watchdog) den Rechner nach dieser Frist zurueck.
# Vorgabe waere 10min; in systemd 257 heisst die Option RebootWatchdogSec (frueher ShutdownWatchdogSec).
#
# 30.9.2026 (Vorfall 27.9.: linux0 hing nach "shutdown -h now" aus wecklauf.sh bis zum
# harten Aus/Ein am 30.9.): RebootWatchdogSec gilt NUR fuer reboot/kexec, nicht fuer
# poweroff/halt - dort schaltet systemd den Watchdog sogar ab. Daher zusaetzlich:
# - RuntimeWatchdogSec: Watchdog im Betrieb und in der ersten Shutdown-Phase (PID 1) scharf.
# - iTCO_wdt nowayout=1 (/etc/modprobe.d/60-itco-nowayout.conf, auch im initrd): systemd
#   kann ihn beim Poweroff nicht mehr abschalten, ein Haenger in der zweiten Phase
#   (systemd-shutdown) fuehrt nach RuntimeWatchdogSec zu Reset/Neustart statt Dauerhaenger.
[Manager]
RebootWatchdogSec=5min
RuntimeWatchdogSec=2min
