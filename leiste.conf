# /etc/leiste.conf - Konfiguration fuer den Befehl "leiste" (Tuya-Steckdosenleisten)
# Quelle: /root/neuserver/leiste.conf, verteilt ueber ziele/"make shziel" -> hier aendern, dann committen.

[leisten]
# Name        Geraete-ID              IP (in der Fritzbox fest zuweisen!)
serverraum    0031545070039f0e28e4    192.168.178.73
anmeldung     0031545070039f0e7f1f    192.168.178.76
sz2           0031545070039f0ecb14    192.168.178.159

[aliase]
# Alias = Leiste Dose   (Leiste darf abgekuerzt sein; Aufruf z.B. "leiste linux0 neustart")
linux0 = se 1
linux1 = se 2
koco   = se 3
pana   = se 4
wser   = a 1
wres   = a 2
heim   = sz 1
linux7 = sz 2
szn4   = sz 3
amd    = sz 4

[geschuetzt]
# An diesen Leisten geht "aus" nur mit --wirklich (ohne Strom kaeme die Dose nur per App/von Hand wieder an)
serverraum
